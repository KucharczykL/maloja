name: tests

on:
  push:
    branches: ['homelab', 'master']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libmagic1 libxml2-dev libxslt1-dev
      - name: Install (with test extra)
        run: pip install -e '.[test]'
      - name: Run tests
        run: pytest -q
